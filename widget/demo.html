<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo chatbota FAQ</title>
  <style>
    :root {
      --bg: #f4f6f5; --card: #fff; --text: #1d2521; --muted: #5d6b64;
      --accent: #2f5d50; --border: #dfe5e2;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141a17; --card: #1c2320; --text: #e8eeeb; --muted: #9aaaa2; --border: #33403a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px 120px; }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tabs button { flex: 1; padding: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; font-size: 1rem; cursor: pointer; }
    .tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tabs button:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .card ul { margin: 12px 0 0; padding-left: 20px; }
    small { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Demo chatbota FAQ</h1>
  <p class="lead">Wybierz firmę, a potem kliknij dymek czatu w prawym dolnym rogu i zadaj pytanie. Obie firmy są wymyślone, a ten sam silnik obsługuje wszystkie.</p>

  <div class="tabs" role="group" aria-label="Wybór firmy">
    <button type="button" data-tenant="salon" aria-pressed="true">Salon fryzjerski</button>
    <button type="button" data-tenant="sklep" aria-pressed="false">Sklep z butami</button>
  </div>

  <section class="card" id="info"></section>
  <p><small>Bot odpowiada wyłącznie na podstawie dokumentów firmy. Demo ma dzienny limit zapytań.</small></p>
</main>

<script>
  var COMPANIES = {
    salon: {
      name: "Salon „Lawenda”", title: "Asystent salonu Lawenda",
      greeting: "Cześć! Zapytaj o cennik, godziny otwarcia lub zasady rezerwacji.",
      tips: ["Ile kosztuje strzyżenie męskie?", "Do której pracujecie w sobotę?", "Czy mogę odwołać wizytę w dniu wizyty?", "Czy robicie tatuaże?"]
    },
    sklep: {
      name: "Sklep „Kroki”", title: "Asystent sklepu Kroki",
      greeting: "Cześć! Zapytaj o dostawę, zwroty lub rozmiary.",
      tips: ["Ile kosztuje dostawa paczkomatem?", "Mam 25,7 cm stopy, jaki rozmiar wybrać?", "Jak zwrócić buty?", "Wyślecie paczkę do Niemiec?"]
    }
  };

  var info = document.getElementById("info");
  var tabs = document.querySelectorAll(".tabs button");

  function show(tenant) {
    var c = COMPANIES[tenant];
    tabs.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.tenant === tenant)); });

    info.textContent = "";
    var h = document.createElement("h2"); h.textContent = c.name; info.appendChild(h);
    var p = document.createElement("div"); p.textContent = "Przykładowe pytania do wypróbowania:"; info.appendChild(p);
    var ul = document.createElement("ul");
    c.tips.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
    info.appendChild(ul);

    // Widget sam usuwa poprzednią instancję przy starcie.
    var s = document.createElement("script");
    s.src = "/widget/chat.js";
    s.dataset.tenant = tenant;
    s.dataset.title = c.title;
    s.dataset.greeting = c.greeting;
    document.body.appendChild(s);
  }

  tabs.forEach(function (b) { b.addEventListener("click", function () { show(b.dataset.tenant); }); });
  show("salon");
</script>
</body>
</html>
